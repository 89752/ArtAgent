# ArtAgent 统一配置（对齐 DeerFlow 的 config.yaml 模式）
# 优先级：环境变量 > config.yaml > 内置默认值
# 值里写 $ENV_NAME 表示从环境变量读取（如 $LLM_API_KEY）

project:
  data_dir: ./data
  index_dir: ./data/index
  uploads_dir: ./data/uploads
  memory_dir: null              # 默认 = data/memory；测试用 ARTAGENT_MEMORY_DIR 覆盖
  core_data_path: ./data/core/artworks_core.csv
  semart_data_dir: ./SemArt
  user_images_dir: ./data/uploads/user_images
  agents_dir: null              # 默认 = agents/

models:
  llm_api_key: $LLM_API_KEY
  llm_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  llm_model: deepseek-v3
  vision_model: qwen3.5-omni-plus-2026-03-15
  request_timeout_sec: 180
  max_retries: 2

retrieval:
  rerank_enabled: true
  rerank_pool: 40
    rerank_api_key: $RERANK_API_KEY
    rerank_model: jina-reranker-v3.5
    # 本机无法直连 Jina 时设置代理（只影响 rerank 请求，如 http://127.0.0.1:7890）
    rerank_proxy: $RERANK_PROXY
    lexical_enabled: true
  lexical_translate: true
  relevance_filter_enabled: true
  default_dataset: core

memory:
  user_id: default_user
  vector_backend: sqlite
    max_items_per_user: 200
    max_chars_per_user: 40000
    # 对齐 DeerFlow 被动记忆：默认开启、每轮触发、防抖异步落库
    auto_extract: true
    extract_interval: 1
    extract_debounce_sec: 2
    smart_merge: true
    profile_refresh: true
    profile_max_age_days: 7

governance:
  tool_timeout_sec: 60
  tool_retries: 1
  tool_output_max_chars: 2000

cost:
  per_1k_input_tokens: 0
  per_1k_output_tokens: 0

logging:
  level: INFO
  file: null

ingestion:
  mineru_token: $MINERU_TOKEN
  mineru_ocr: true

subagents:
  max_concurrent: 3            # 子智能体并发上限
  max_total_per_run: 6         # 单次 delegate_task 最多派发任务数
  timeout_sec: 300             # 单个子任务超时
  max_turns: 15                # 子智能体最大思考轮数
