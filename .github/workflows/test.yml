name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
      - name: Run web/API and render tests
        run: |
          pytest tests/test_service_render.py tests/test_web_api.py tests/test_core_integration.py -q
