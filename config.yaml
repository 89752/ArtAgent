# ArtAgent 统一配置（config.yaml 模式）
# 优先级：环境变量 > config.yaml > 内置默认值
# 值里写 $ENV_NAME 表示从环境变量读取（如 $LLM_API_KEY）
# 本文件已入库且不含任何密钥（全部为 $ENV 引用或非敏感默认值）；
# 密钥与模型值放 .env，二者不重复。
#
# 注意：以下功能开关不走 config.yaml，由对应模块直接读同名环境变量：
#   · 检索：RERANK_ENABLED / RERANK_POOL / RERANK_API_KEY / RERANK_MODEL /
#     RERANK_PROXY / LEXICAL_ENABLED / LEXICAL_TRANSLATE /
#     RELEVANCE_FILTER_ENABLED / DEFAULT_DATASET
#   · 记忆：MEMORY_USER_ID / MEMORY_VECTOR_BACKEND / MEMORY_MAX_ITEMS_PER_USER /
#     MEMORY_MAX_CHARS_PER_USER / MEMORY_AUTO_EXTRACT / MEMORY_EXTRACT_INTERVAL /
#     MEMORY_EXTRACT_DEBOUNCE_SEC / MEMORY_SMART_MERGE / MEMORY_PROFILE_REFRESH /
#     MEMORY_PROFILE_MAX_AGE_DAYS
#   · 路径：INDEX_DIR / UPLOADS_DIR / CORE_DATA_PATH / SEMART_DATA_DIR /
#     USER_IMAGES_DIR / ARTAGENT_MEMORY_DIR
#   · 其他：ARTAGENT_LOG_LEVEL / ARTAGENT_LOG_FILE / MINERU_TOKEN / MINERU_OCR /
#     COST_PER_1K_INPUT_TOKENS / COST_PER_1K_OUTPUT_TOKENS /
#     ARTAGENT_SEED_DEFAULT_ACCOUNT（=1 时创建旧默认管理员 user/11111111，勿用于共享部署）

models:
  llm_api_key: $LLM_API_KEY
  llm_base_url: $LLM_BASE_URL
  llm_model: $LLM_MODEL

  # 视觉模型可选：缺省回落对话模型（LLM_MODEL 需支持图像输入，如 qwen3.7-flash）
  # vision_api_key: $VISION_API_KEY
  # vision_base_url: $VISION_BASE_URL
  # vision_model: $VISION_MODEL

  # 评估裁判模型（llm-as-judge）：可配更强/更稳的独立模型，缺省同对话模型
  judge_model: $JUDGE_MODEL
  judge_api_key: $JUDGE_API_KEY # 缺省回落 LLM_API_KEY
  judge_base_url: $JUDGE_BASE_URL # 缺省回落 LLM_BASE_URL

  request_timeout_sec: 180
  max_retries: 2

retrieval:
  # 用户 PDF 整页图检索的嵌入模型（文搜图）
  # provider: dashscope（默认）或 openai（OpenAI 兼容 /embeddings 端点）
  # 切换嵌入模型会改变向量空间，旧向量不可比，需重建 user_pdf_images collection
  pdf_image_embed_provider: dashscope
  pdf_image_embed_model: tongyi-embedding-vision-plus
  pdf_image_embed_api_key: $PDF_IMAGE_EMBED_API_KEY # 缺省回落 LLM_API_KEY
  pdf_image_embed_base_url: $PDF_IMAGE_EMBED_BASE_URL # openai 必填；缺省回落 LLM_BASE_URL

governance:
  tool_timeout_sec: 600 # 技能/子智能体是多步 LLM 循环，300s 仍会被推荐类技能超出
  tool_retries: 1
  tool_output_max_chars: 2000

subagents:
  max_concurrent: 3 # 子智能体并发上限
  max_total_per_run: 6 # 单次 delegate_task 最多派发任务数
  timeout_sec: 300 # 单个子任务超时
  max_turns: 15 # 子智能体最大思考轮数
