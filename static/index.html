<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="西方艺术智能助手：围绕艺术作品、艺术家、风格流派与历史背景的 AI 问答与资料管理"/>
  <title>西方艺术智能助手</title>
  <link rel="icon" href="/static/emblem.svg"/>
  <link rel="stylesheet" href="/static/app.css?v=12"/>
  <script>
    /* marked 本地优先，CDN 兜底（离线/内网仍可用） */
    (function () {
      var s = document.createElement("script");
      s.src = "/static/lib/marked.min.js";
      s.onerror = function () {
        var c = document.createElement("script");
        c.src = "https://cdn.jsdelivr.net/npm/marked/marked.min.js";
        document.head.appendChild(c);
      };
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <div id="app">
    <!-- ══════════ 侧栏：品牌 / 新建对话 / 历史（主导航） ══════════ -->
    <div id="side-overlay" class="side-overlay" hidden></div>
    <aside id="sidebar" aria-label="主导航">
      <div class="brand">
        <img class="brand-mark" src="/static/emblem.svg" alt=""/>
        <div class="brand-name">西方艺术智能助手</div>
      </div>

      <button id="btn-new" class="btn-new" type="button">
        <span class="plus">＋</span> 新建对话
      </button>

      <div class="side-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <path d="M20 20l-3.2-3.2"/>
        </svg>
        <input id="hist-filter" type="search" placeholder="搜索历史对话" aria-label="搜索历史对话"/>
      </div>

      <nav id="history" class="history" aria-label="历史对话"></nav>

      <button id="btn-theme" class="side-theme" type="button" aria-label="切换深色模式" title="切换深色模式">
        <span class="theme-ico-moon" aria-hidden="true">☾</span>
        <span class="theme-ico-sun" aria-hidden="true">☀</span>
      </button>

      <div id="user-card" class="user-card">
        <div class="u-avatar">
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="4">
              <circle cx="50" cy="36" r="18"/>
              <path d="M18 88 C18 64 34 56 50 56 C66 56 82 64 82 88"/>
            </g>
          </svg>
        </div>
        <div class="u-meta">
          <div class="u-name">学者</div>
          <div class="u-level" id="u-level">Lv.1 初见</div>
        </div>
      </div>
    </aside>

    <!-- ══════════ 主区 ══════════ -->
    <main id="main">
      <header id="topbar" class="topbar">
        <button id="btn-menu" class="icon-btn btn-menu" type="button" aria-label="打开菜单" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <div class="tb-title" id="tb-title">新对话</div>
        <div class="tb-actions">
          <button id="btn-dataset" class="dataset-pill" type="button" title="切换数据源">
            <span class="pill-dot" aria-hidden="true"></span>
            <span id="dataset-pill-label">核心库</span>
          </button>
          <button id="btn-library" class="tb-btn" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/>
              <path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/>
            </svg>
            <span>资料库</span>
          </button>
          <button id="btn-clear" class="tb-btn danger" type="button" title="删除当前会话历史">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
            </svg>
            <span>清除对话</span>
          </button>
        </div>
      </header>

      <!-- 欢迎态 -->
      <section id="welcome" class="welcome">
        <div class="w-inner">
          <img class="w-mark" src="/static/emblem.svg" alt="天使徽标"/>
          <h1 class="w-title">
            <span class="flr flr-l" aria-hidden="true"></span>
            <span>西方艺术智能助手</span>
            <span class="flr flr-r" aria-hidden="true"></span>
          </h1>
          <div class="w-divider" aria-hidden="true"></div>
          <p class="w-greeting">您好，我是您的西方艺术智能助手。</p>
          <p class="w-hint">向我提问关于艺术作品、艺术家、风格流派与历史背景的一切。</p>
          <div id="cards" class="cards"></div>
        </div>
      </section>

      <!-- 对话态消息流 -->
      <section id="chat" class="chat is-hidden" aria-label="对话内容" aria-live="polite"></section>

      <!-- 输入区：附件 chip + 输入框 -->
      <div class="composer">
        <div id="chips" class="chips" hidden></div>
        <div class="composer-inner">
          <button id="btn-attach" class="btn-attach" type="button" aria-label="上传文档" title="上传 PDF / CSV / Excel 文档">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21.4 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
            </svg>
          </button>
          <textarea id="msg" rows="1" placeholder="输入您的问题或想法…" aria-label="消息输入框"></textarea>
          <button id="btn-send" class="btn-send" type="button" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="ico-send">
              <path d="M4 12h15M13 6l6 6-6 6"/>
            </svg>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" aria-hidden="true" class="ico-stop">
              <path d="M8 8h8v8H8z"/>
            </svg>
          </button>
        </div>
        <input type="file" id="file-input" accept=".pdf,.csv,.xlsx,.xls" hidden multiple/>
        <div class="disclaimer">内容由 AI 生成，仅供学习参考，请结合权威资料深入研究。</div>
      </div>
    </main>
  </div>

  <!-- ══════════ 资料库抽屉：上传 / 文档管理 / 数据源 ══════════ -->
  <div id="library" class="drawer" hidden role="dialog" aria-modal="true" aria-label="资料库">
    <div class="drawer-backdrop" data-close="library"></div>
    <aside class="drawer-panel">
      <header class="drawer-head">
        <h2>资料库</h2>
        <button class="drawer-close" type="button" data-close="library" aria-label="关闭资料库">×</button>
      </header>
      <div class="drawer-body">
        <section class="lib-upload">
          <button id="btn-upload" class="btn-upload" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 16V4M6 10l6-6 6 6"/>
              <path d="M4 20h16"/>
            </svg>
            上传文档
          </button>
          <p class="lib-hint">支持 PDF / CSV / XLSX，上传后自动解析入库</p>
        </section>

        <section class="lib-block">
          <h3>当前数据源</h3>
          <select id="dataset-select" class="dataset-select" aria-label="切换数据源"></select>
          <div id="dataset-hint" class="dataset-hint"></div>
        </section>

        <section class="lib-block">
          <h3>我的文档 <span id="doc-count" class="lib-count"></span></h3>
          <nav id="doc-list" class="doc-list" aria-label="文档列表"></nav>
        </section>
      </div>
    </aside>
  </div>

  <!-- ══════════ schema 确认弹窗（表格列角色） ══════════ -->
  <div id="schema-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="schema-title">
    <div class="modal-backdrop" data-close="schema"></div>
    <div class="schema-card">
      <div class="schema-title" id="schema-title">确认表格列角色</div>
      <div id="schema-meta" class="schema-meta"></div>
      <div class="schema-grid">
        <label>实体名列（必填）<select id="schema-entity"></select></label>
        <label>时间/分类轴列<select id="schema-axis"></select></label>
        <label>描述文本列<select id="schema-desc"></select></label>
        <label>图片列<select id="schema-image"></select></label>
      </div>
      <label class="schema-name-label">显示名<input id="schema-display" type="text" maxlength="20"/></label>
      <div id="schema-reason" class="schema-reason"></div>
      <div id="schema-error" class="schema-error" hidden></div>
      <div class="schema-actions">
        <button id="schema-cancel" class="btn-schema-cancel" type="button">取消</button>
        <button id="schema-ok" class="btn-schema-ok" type="button">确认并启用</button>
      </div>
    </div>
  </div>

  <!-- ══════════ 通用确认弹窗 ══════════ -->
  <div id="confirm-modal" class="modal" hidden role="alertdialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-backdrop" data-close="confirm"></div>
    <div class="schema-card confirm-card">
      <div class="schema-title" id="confirm-title">确认操作</div>
      <div id="confirm-text" class="confirm-text"></div>
      <div class="schema-actions">
        <button id="confirm-cancel" class="btn-schema-cancel" type="button">取消</button>
        <button id="confirm-ok" class="btn-schema-ok danger" type="button">确认</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/static/app.js?v=12"></script>
</body>
</html>
